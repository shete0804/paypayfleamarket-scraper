[project]
name = "price-watch-paypay"
version = "0.1.0"
description = "PayPay フリマ 価格監視スクリプト"

requires-python = ">=3.11"

dependencies = [
    "pyyaml>=6.0.3",
    "ruamel.yaml>=0.18.6",
    "my-lib @ git+https://github.com/kimata/my-py-lib@2396a082d68e98ad807e06041293f5c364d100b6",
    "patchright>=1.62.0",
    "selenium>=4.39.0",
    "undetected-chromedriver>=3.5.5",
    "setuptools>=75.0.0",
    "pillow>=12.1.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.14.3",
]

[project.scripts]
price-watch = "price_watch.cli.app:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
