name: PayPay Flea Market Scraper

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install requests beautifulsoup4 selenium
          pip install undetected-chromedriver
          pip install playwright

      - name: Install Playwright browsers
        run: playwright install chromium

      - name: "Debug: Fetch raw HTML"
        run: python debug_html.py

      - name: Scrape and update PayPay
        run: python update_listings.py

      - name: Scrape and update Mercari
        run: python mercari_scraper.py

      - name: "Debug: Test scrape"
        run: python test_scrape.py 2>&1 || true

      - name: Send to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python paypayfleamarket_scraper.py

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add listings.json update_listings_debug.log 2>/dev/null || true
          git commit -m "auto: update listings & debug log" || true
          git push https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git || true
