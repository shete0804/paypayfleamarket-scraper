name: PayPay Flea Market Scraper

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'

# Final Session 2 Trigger: 2026-09-22 08:23:19 UTC - Force Run execution with enhanced selector patterns

jobs:
