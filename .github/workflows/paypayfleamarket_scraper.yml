name: PayPay Flea Market Scraper

on:
  workflow_dispatch:
    schedule:
        - cron: '0 */6 * * *'

        jobs:
          scrape:
              runs-on: ubuntu-latest
                  timeout-minutes: 30
                      steps:
                            - uses: actions/checkout@v4
                                  - uses: actions/setup-python@v4
                                          with:
                                                    python-version: '3.12'
                                                          - name: Install Chrome
                                                                  run: |
                                                                            sudo apt-get update
                                                                                      sudo apt-get install -y chromium-browser chromium-chromedriver libgbm1 libxss1 libappindicator1 libindicator7
                                                                                            - name: Install dependencies
                                                                                                    run: pip install -r paypayfleamarket_requirements.txt
                                                                                                          - name: Run scraper
                                                                                                                  env:
                                                                                                                            DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
                                                                                                                                    run: python paypayfleamarket_scraper.py
